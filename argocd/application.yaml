
apiVersion: argoproj.io/v1alpha1

kind: Application

metadata:

  name: nodejs-app

  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/imagefactory-web/3-tier-test.git

    targetRevision: main

    path: helm/nodejs-app

  destination:

    server: https://kubernetes.default.svc

    namespace: qa

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

    - CreateNamespace=true